name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    name: Backend unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run pure-function tests
        working-directory: backend
        run: pytest tests/ -m "not integration" -q

  backend-integration:
    name: Backend integration tests (Postgres+PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: wildlife_user
          POSTGRES_PASSWORD: wildlife_password
          POSTGRES_DB: wildlife_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildlife_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wildlife_user:wildlife_password@localhost:5432/wildlife_db_test
      TEST_DATABASE_URL: postgresql://wildlife_user:wildlife_password@localhost:5432/wildlife_db_test
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run integration tests
        working-directory: backend
        run: pytest tests/ -m integration -q

  frontend:
    name: Frontend lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --ci
      - name: Build
        working-directory: frontend
        run: npm run build
