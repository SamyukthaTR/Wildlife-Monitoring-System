name: Publish backend image

# Builds the backend's ML-heavy production image (torch, transformers,
# ultralytics, ...) once in CI and pushes it to GHCR, so a deploy target
# doesn't have to rebuild those dependencies from scratch. Only runs after CI
# passes on main. The frontend image is not published here because
# NEXT_PUBLIC_API_URL is baked in at build time and is deploy-specific -- it
# still gets built on the deploy target from docker-compose.prod.yml, which
# is fast (no ML deps).
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

jobs:
  publish-backend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        # GHCR image names must be lowercase; github.repository is not
        # guaranteed to be (this repo owner has mixed case), and GitHub
        # Actions expressions have no built-in toLower().
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
